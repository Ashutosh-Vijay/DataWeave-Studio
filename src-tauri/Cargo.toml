[package]
name = "app"
version = "2.4.0"
description = "A fast, local workbench for DataWeave 2.0"
authors = ["Ashutosh Vijay"]
license = "MIT"
repository = "https://github.com/ashutosh-vijay/DataWeave-Studio"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tokio = { version = "1", features = ["time", "rt", "rt-multi-thread", "net", "sync", "macros"] }
# Lightweight blocking HTTP (rustls — no OpenSSL) for the Maven Central jar fetch.
ureq = "2"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
# In-process MCP server (Streamable HTTP) that exposes the DataWeave engine to AI
# agents. axum 0.8 matches rmcp's own axum so the tower service nests cleanly.
rmcp = { version = "1.7", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8"
# Parse Config / Secure Config YAML for ${key} substitution in the MCP tool.
serde_yaml = "0.9"
# Decode base64 multipart part bytes supplied by an MCP agent (binary-safe).
base64 = "0.22"
