<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>DataWeave Studio</title>
    <style>
      /* Paint the loader on the very first frame, before React mounts —
         eliminates the 1-2s blank window during WebView/JVM cold start. The
         #boot-loader element is removed inside SplashScreen.tsx as soon as
         the React splash is in place, so the visual hand-off is seamless. */
      html, body {
        background: oklch(15% 0.005 80);
        margin: 0;
        height: 100%;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: oklch(75% 0.005 80);
      }
      @media (prefers-color-scheme: light) {
        html, body { background: oklch(98% 0.003 80); color: oklch(40% 0.005 80); }
      }
      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        z-index: 9999;
      }
      #boot-loader .ring {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 2px solid color-mix(in oklch, oklch(72% 0.15 158) 25%, transparent);
        border-top-color: oklch(72% 0.15 158);
        animation: bl-spin 900ms linear infinite;
      }
      #boot-loader .label {
        font-size: 12px;
        letter-spacing: 0.4px;
        opacity: 0.7;
      }
      @keyframes bl-spin { to { transform: rotate(360deg); } }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <div id="boot-loader" aria-hidden="true">
      <div class="ring"></div>
      <div class="label">Starting DataWeave Studio…</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
