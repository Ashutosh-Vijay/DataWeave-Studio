name: Publish Web Edition (GitHub Pages)

# The browser build: the DataWeave engine compiled to WebAssembly with GraalVM
# Web Image, plus the React UI as a static site. Nothing runs server-side, so
# GitHub Pages serves it as-is.
#
# The site is platform-neutral (wasm + js), so one fully optimised Linux build
# is all Pages needs. The engine is not rebuilt per visitor: it is compiled
# once here, uploaded with the rest of dist-web/, and cached by the browser.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=4096
  BINARYEN_VERSION: '133'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Web Image (--tool:svm-wasm) ships with Oracle GraalVM only, not Community.
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Install binaryen (wasm-as)
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" | tar xz
          echo "$RUNNER_TEMP/binaryen-version_${BINARYEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build the WASM engine
        run: npm run build:wasm

      - name: Smoke-test the engine
        run: node web-wasm/smoke-test.cjs

      - name: Build the static site
        run: |
          npm ci
          npm run build:web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
