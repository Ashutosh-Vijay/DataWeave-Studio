name: Build & Release

on:
  push:
    tags:
      # Digit required after the v: plain `v*` also matched the VS Code
      # extension tags (vscode-v0.0.1 starts with "v"), double-triggering this
      # workflow on every extension release.
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Vite + Monaco bundle exceeds Node's 2 GB default on macOS x86_64 runners.
  NODE_OPTIONS: --max-old-space-size=4096
  # linuxdeploy/appimagetool are themselves AppImages; ubuntu-24.04 runners have
  # no FUSE, so tell them to self-extract instead of FUSE-mounting. Harmless on
  # Windows/macOS jobs.
  APPIMAGE_EXTRACT_AND_RUN: "1"
  # linuxdeploy runs `strip` on every ELF it bundles — the jlinked JRE's
  # binaries/libs make it bail ("failed to run linuxdeploy" right after deb+rpm
  # bundle fine). Skip stripping; jlink already stripped the JRE.
  NO_STRIP: "true"

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Delete existing release if present
        run: |
          gh release delete "${{ github.ref_name }}" --repo "${{ github.repository }}" --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        # jdkArch selects the Temurin build (and the jlinked JRE's arch). The
        # Intel macOS target builds its x64 JRE with an x64 JDK via Rosetta on
        # the arm64 runner (macos-latest is Apple Silicon; macos-13 is retired).
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            jdkArch: x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            jdkArch: aarch64
          - platform: macos-latest
            target: x86_64-apple-darwin
            jdkArch: x64
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            jdkArch: x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Set up JDK (for dwstudio-server)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          architecture: ${{ matrix.jdkArch }}

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          # FUSE for linuxdeploy (belt-and-suspenders alongside APPIMAGE_EXTRACT_AND_RUN).
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Build dwstudio-server.jar
        shell: bash
        run: |
          cd dw-server
          mvn -B -q -DskipTests package
          mkdir -p ../src-tauri/resources/dw-server
          cp target/dwstudio-server.jar ../src-tauri/resources/dw-server/

      - name: Bundle minimal JRE (jlink)
        shell: bash
        run: |
          MODULES=$(jdeps --print-module-deps --ignore-missing-deps --multi-release 17 src-tauri/resources/dw-server/dwstudio-server.jar 2>/dev/null || echo "java.base,java.compiler,java.desktop,java.management,java.security.sasl,java.sql.rowset")
          jlink --add-modules "$MODULES" --strip-debug --no-man-pages --no-header-files --compress=2 --output src-tauri/resources/jre
          echo "Bundled JRE size: $(du -sh src-tauri/resources/jre | cut -f1)"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # AppImage: linuxdeploy resolves dependencies for every ELF in the
          # AppDir, including the bundled JRE's libs. libnet.so & co. declare
          # libjvm.so, which lives in jre/lib/server/ and is found via the JVM's
          # own rpath at runtime — but linuxdeploy only searches standard paths
          # and hard-fails ("Could not find dependency: libjvm.so"). Point it at
          # the JRE's lib dirs. Empty/harmless on Windows & macOS jobs.
          LD_LIBRARY_PATH: ${{ matrix.platform == 'ubuntu-latest' && format('{0}/src-tauri/resources/jre/lib:{0}/src-tauri/resources/jre/lib/server', github.workspace) || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DataWeave Studio ${{ github.ref_name }}'
          releaseBody: |
            ### Downloads
            - **Windows**: `.exe` (NSIS installer), `.msi`, `_x64_portable.zip` (no install — unzip & run), or `_x64-setup.zip` (zipped installer, if a proxy blocks the `.exe`)
            - **macOS**: `.dmg` (Apple Silicon and Intel)
            - **Linux**: `.AppImage`, `.deb`, or `.rpm`

            Fully self-contained — bundles the DataWeave 2.11 runtime and a
            minimal JRE 17. No system Java required. See
            [SECURITY.md](https://github.com/Ashutosh-Vijay/DataWeave-Studio/blob/main/SECURITY.md)
            for data-handling / network details.

            ### Opening an unsigned build
            The app isn't code-signed yet, so your OS warns on first launch — it's safe.
            - **Windows (SmartScreen)**: **More info → Run anyway**.
            - **Windows (Smart App Control / "admin prevented install")**: use the **`_x64_portable.zip`** — unzip anywhere and run `DataWeave Studio.exe`, no installer. (Signing-level blocks like Smart App Control can't be bypassed per-app.)
            - **macOS**: a *"damaged"* warning is just Gatekeeper. Move the app to Applications, then **System Settings → Privacy & Security → Open Anyway** — or run `xattr -cr "/Applications/DataWeave Studio.app"` and launch it.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          # --verbose on Linux so a linuxdeploy failure prints its actual stderr
          # instead of the bare "failed to run linuxdeploy".
          args: --target ${{ matrix.target }} ${{ matrix.platform == 'ubuntu-latest' && '--verbose' || '' }}

      - name: Zip Windows installer for proxy-restricted environments
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $exe = Get-ChildItem -Recurse -Filter "*_x64-setup.exe" src-tauri/target | Select-Object -First 1
          if ($exe) {
            $zip = Join-Path $exe.DirectoryName "DataWeave.Studio_${version}_x64-setup.zip"
            Compress-Archive -Path $exe.FullName -DestinationPath $zip -Force
            gh release upload "${{ github.ref_name }}" $zip --repo "${{ github.repository }}" --clobber
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # True portable build: extract the NSIS bundle's files (no install, no
      # admin) into a folder, then zip it. Unzipping anywhere gives a run-in-place
      # "DataWeave Studio.exe" — no installer, so it works where the MSI/NSIS
      # install step is policy-blocked. (Does NOT bypass code-signing warnings
      # like Smart App Control / SmartScreen — only signing does.)
      - name: Build portable Windows zip (run-in-place, no installer)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $exe = Get-ChildItem -Recurse -Filter "*_x64-setup.exe" src-tauri/target | Select-Object -First 1
          if (-not $exe) { Write-Host "No NSIS setup exe found; skipping portable build"; exit 0 }
          $dest = "C:\dwsportable"
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          # Extract the NSIS bundle's payload WITHOUT running it. The previous
          # "/S silent install + poll" was flaky in CI — the installer can return
          # before (or without) writing files, or ignore /D, leaving $dest empty.
          # 7-Zip understands the NSIS format and ships on GitHub windows runners,
          # so this is deterministic, needs no admin, and triggers no WebView2
          # bootstrap.
          & 7z x "$($exe.FullName)" "-o$dest" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Error "7z failed to extract $($exe.Name) (exit $LASTEXITCODE)"; exit 1 }
          # Drop NSIS scaffolding that isn't part of the shipped app.
          Remove-Item -Recurse -Force "$dest\`$PLUGINSDIR" -ErrorAction SilentlyContinue
          Remove-Item -Force "$dest\uninstall.exe" -ErrorAction SilentlyContinue
          # 7z extracts the main binary under its NSIS *source* name (app.exe,
          # the cargo bin name) — the install-time rename to the product name is
          # an NSIS script step that doesn't run during extraction. Rename it.
          if ((Test-Path "$dest\app.exe") -and -not (Test-Path "$dest\DataWeave Studio.exe")) {
            Rename-Item "$dest\app.exe" "DataWeave Studio.exe"
          }
          $appExe = Get-ChildItem -Recurse -Filter "DataWeave Studio.exe" $dest -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $appExe) {
            Write-Host "Extraction tree under ${dest}:"
            Get-ChildItem -Recurse $dest | Select-Object -ExpandProperty FullName
            Write-Error "Portable build: app exe not found after extracting $($exe.Name)"
            exit 1
          }
          # Zip the folder that actually holds the exe (root, or a nested app dir).
          $zip = "DataWeave.Studio_${version}_x64_portable.zip"
          Compress-Archive -Path "$($appExe.Directory.FullName)\*" -DestinationPath $zip -Force
          gh release upload "${{ github.ref_name }}" $zip --repo "${{ github.repository }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        run: gh release edit "${{ github.ref_name }}" --draft=false --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
