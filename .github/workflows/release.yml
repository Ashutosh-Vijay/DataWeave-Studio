name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Vite + Monaco bundle exceeds Node's 2 GB default on macOS x86_64 runners.
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Delete existing release if present
        run: |
          gh release delete "${{ github.ref_name }}" --repo "${{ github.repository }}" --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Set up JDK (for dwstudio-server)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build dwstudio-server.jar
        shell: bash
        run: |
          cd dw-server
          mvn -B -q -DskipTests package
          mkdir -p ../src-tauri/resources/dw-server
          cp target/dwstudio-server.jar ../src-tauri/resources/dw-server/

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DataWeave Studio ${{ github.ref_name }}'
          releaseBody: |
            ### Downloads
            - **Windows**: `.exe` (NSIS installer), `.exe.zip` (if .exe is blocked), or `.msi`
            - **macOS**: `.dmg` (Apple Silicon and Intel)

            Bundled with the DataWeave 2.11 runtime. Requires Java 8 or newer
            (most Mule devs already have one — get it from https://adoptium.net
            if not).
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.target }}

      - name: Zip Windows installer for proxy-restricted environments
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $exe = Get-ChildItem -Recurse -Filter "*_x64-setup.exe" src-tauri/target | Select-Object -First 1
          if ($exe) {
            $zip = Join-Path $exe.DirectoryName "DataWeave.Studio_${version}_x64-setup.zip"
            Compress-Archive -Path $exe.FullName -DestinationPath $zip -Force
            gh release upload "${{ github.ref_name }}" $zip --repo "${{ github.repository }}" --clobber
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        run: gh release edit "${{ github.ref_name }}" --draft=false --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
